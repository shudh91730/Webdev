<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cursed Button</title>
  <style>
    body {
      min-height: 100vh;
      background: #111;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    .cursed-btn {
      padding: 18px 36px;
      font-size: 1.2rem;
      font-weight: 900;
      color: #fff;
      background: #ff0055;
      border: 4px solid #00ffcc;
      cursor: pointer;
      animation: panic 1.2s linear infinite;
    }

    .cursed-btn:hover {
      animation-duration: 0.35s;
    }

    @keyframes panic {
      0%   { transform: translate(0, 0) rotate(0deg) scale(1); filter: hue-rotate(0deg); }
      20%  { transform: translate(90px, -60px) rotate(140deg) scale(1.3, 0.7); }
      40%  { transform: translate(-110px, 40px) rotate(-90deg) scale(0.7, 1.4); }
      60%  { transform: translate(70px, 80px) rotate(220deg) scale(1.2); }
      80%  { transform: translate(-80px, -70px) rotate(-180deg) scale(0.8); }
      100% { transform: translate(0, 0) rotate(360deg) scale(1); filter: hue-rotate(360deg); }
    }
  </style>
</head>
<body>
  <button class="cursed-btn" onclick="alert('How did you click this?!')">SUBMIT EXAM</button>
</body>
</html>
