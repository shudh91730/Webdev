<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Moire Interference</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .moire-box {
      position: relative;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #fff;
    }

    .grid-layer {
      position: absolute;
      inset: -50%;
      background-image: repeating-linear-gradient(
        0deg,
        #ffffff 0px,
        #ffffff 3px,
        transparent 3px,
        transparent 10px
      ),
      repeating-linear-gradient(
        90deg,
        #ffffff 0px,
        #ffffff 3px,
        transparent 3px,
        transparent 10px
      );
    }

    .layer-1 {
      animation: spin-cw 14s linear infinite;
    }

    .layer-2 {
      animation: spin-ccw 11s linear infinite;
    }

    @keyframes spin-cw {
      to { transform: rotate(360deg) scale(1.15); }
    }

    @keyframes spin-ccw {
      to { transform: rotate(-360deg) scale(0.95); }
    }
  </style>
</head>
<body>
  <div class="moire-box">
    <div class="grid-layer layer-1"></div>
    <div class="grid-layer layer-2"></div>
  </div>
</body>
</html>
