<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shockwave Pulse Button</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #09090b;
      display: grid;
      place-items: center;
    }

    .shockwave-btn {
      position: relative;
      padding: 18px 42px;
      font-size: 1.05rem;
      font-weight: 800;
      color: #09090b;
      background: #ffcc00;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .shockwave-btn:hover {
      background: #ffd633;
      transform: scale(1.04);
    }

    .shockwave-btn:active {
      transform: scale(0.97);
    }

    .shockwave-btn::before,
    .shockwave-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 999px;
      border: 2px solid #ffcc00;
      pointer-events: none;
      animation: shockwave 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }

    .shockwave-btn::after {
      animation-delay: 0.9s;
    }

    @keyframes shockwave {
      0% {
        transform: scale(1);
        opacity: 0.9;
      }
      100% {
        transform: scale(1.75);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <button class="shockwave-btn">Launch Mission</button>

</body>
</html>
