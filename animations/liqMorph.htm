<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Morphing Blob</title>
  <style>
    * {
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #09090b;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .blob-stage {
      position: relative;
      display: grid;
      place-items: center;
    }

    .blob {
      width: 240px;
      height: 240px;
      background: linear-gradient(135deg, #ff007f, #ff8c00);
      box-shadow: 0 0 60px rgba(255, 0, 127, 0.35);
      animation: morph 5s ease-in-out infinite alternate, hue-spin 8s linear infinite;
    }

    .blob-label {
      position: absolute;
      color: #ffffff;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }

    @keyframes morph {
      0% {
        border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
        transform: scale(1) rotate(0deg);
      }
      50% {
        border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%;
        transform: scale(1.12) rotate(90deg);
      }
      100% {
        border-radius: 50% 50% 20% 80% / 25% 80% 20% 75%;
        transform: scale(0.95) rotate(180deg);
      }
    }

    @keyframes hue-spin {
      to {
        filter: hue-rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="blob-stage">
    <div class="blob"></div>
    <span class="blob-label">Core Active</span>
  </div>

</body>
</html>
