<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyberpunk Glitch Text</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #09090b;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .glitch {
      position: relative;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 4px;
      animation: glitch-skew 1.2s infinite linear alternate-reverse;
      user-select: none;
    }

    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #09090b;
    }

    .glitch::before {
      left: 3px;
      text-shadow: -3px 0 #ff0055;
      animation: glitch-anim-1 2s infinite linear alternate-reverse;
    }

    .glitch::after {
      left: -3px;
      text-shadow: 3px 0 #00f0ff;
      animation: glitch-anim-2 1.5s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim-1 {
      0% { clip-path: inset(12% 0 70% 0); transform: translate(-3px, 1px); }
      25% { clip-path: inset(58% 0 15% 0); transform: translate(3px, -1px); }
      50% { clip-path: inset(30% 0 45% 0); transform: translate(-2px, 2px); }
      75% { clip-path: inset(75% 0 5% 0); transform: translate(2px, -2px); }
      100% { clip-path: inset(20% 0 60% 0); transform: translate(-1px, 1px); }
    }

    @keyframes glitch-anim-2 {
      0% { clip-path: inset(65% 0 15% 0); transform: translate(3px, -2px); }
      25% { clip-path: inset(10% 0 65% 0); transform: translate(-3px, 1px); }
      50% { clip-path: inset(45% 0 25% 0); transform: translate(2px, -1px); }
      75% { clip-path: inset(5% 0 80% 0); transform: translate(-2px, 2px); }
      100% { clip-path: inset(50% 0 30% 0); transform: translate(1px, -1px); }
    }

    @keyframes glitch-skew {
      0%, 88% { transform: skew(0deg); }
      92% { transform: skew(10deg); }
      96% { transform: skew(-10deg); }
      100% { transform: skew(0deg); }
    }
  </style>
</head>
<body>

  <h1 class="glitch" data-text="WASTED">WASTED</h1>

</body>
</html>
