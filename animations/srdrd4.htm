<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Vortex Tunnel</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .tunnel {
      position: relative;
      width: 300px;
      height: 300px;
      display: grid;
      place-items: center;
    }

    .ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 8px dashed #00ffcc;
      box-shadow: 0 0 25px #ff007f, inset 0 0 25px #00ffcc;
      animation: dive 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .ring:nth-child(2) { animation-delay: -0.4s; border-color: #ff007f; }
    .ring:nth-child(3) { animation-delay: -0.8s; border-color: #ffcc00; }
    .ring:nth-child(4) { animation-delay: -1.2s; border-color: #00f0ff; }
    .ring:nth-child(5) { animation-delay: -1.6s; border-color: #ff007f; }
    .ring:nth-child(6) { animation-delay: -2.0s; border-color: #00ffcc; }

    @keyframes dive {
      0% {
        transform: scale(0.05) rotate(0deg);
        opacity: 0;
      }
      40% {
        opacity: 1;
      }
      100% {
        transform: scale(3.5) rotate(180deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="tunnel">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
  </div>
</body>
</html>
