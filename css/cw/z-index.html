<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Image Behind Text</title>
    <style>
      img {
        position: absolute;
        left: 0;
        top: 0;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <h1>This is a heading which is in the top</h1>
    <img src="image.png" alt="tree image">
    <p>Tree image will be behind the text.</p>
  </body>
</html>
