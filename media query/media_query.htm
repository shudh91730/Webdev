<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: aqua;
            color: rgb(0, 30, 255);
            font-size: larger;
            height: 200px;
            width: 200px;
            display: grid;
        }
        @media (min-width: 600px){
            .container{
                color: crimson;
                height: 400px;
                width: 400px;
                text-align: center;
            }
        }
        @media (min-width: 768px){
            .container{
                color: rgb(7, 35, 121);
                height: 600px;
                width: 600px;
                text-align: center;
            }
            .content:hover{
                color: black;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="content">
            Learning media query and its use-methods.
        </p>
    </div>
</body>
</html>
