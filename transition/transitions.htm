<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    div{
    background-color: aqua;
    border: 1px solid black;
    border-radius: 5px;
    width: 91px;
    height: 100px;   
    transition: width 2s, height 2s, background-color 2s, rotate 2s, transform 1s;
    }
    .box1:hover{
       width: 50%;
       height: 500px;
       background-color: blueviolet;
       rotate: 90deg;
       transition-timing-function: ease;
    }
    .box2:hover{
        transition-timing-function: ease-in;
        rotate: -90deg;

    }
    .box3:hover{
        transition-timing-function: ease-out;
        rotate: 90deg;

    }
    .box4:hover{
        transition-timing-function: ease-in-out;
        /* rotate: 90deg; */
        transform: rotate(90deg);

    }
    </style>
</head>
<body>
    <div class="box1">
        <h1>(>☺︎<)</h1>
    </div>
    <div class="box2">

    </div>
    <div class="box3">

    </div>
    <div class="box4">

    </div>
</body>
</html>
