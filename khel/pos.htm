<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Positioning</title>
  <style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        width: 100%;
        height: 100vh;
        font-family: "Times New Roman", serif;
    }

    .background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
    }

    .name-grid {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        padding: 8px;
        color: black;
        font-size: 12px;
        font-weight: bold;
    }

    .name-grid div:nth-child(1),
    .name-grid div:nth-child(4),
    .name-grid div:nth-child(7) {
        justify-content: flex-start;
    }

    .name-grid div:nth-child(2),
    .name-grid div:nth-child(5),
    .name-grid div:nth-child(8) {
        justify-content: center;
    }

    .name-grid div:nth-child(3),
    .name-grid div:nth-child(6),
    .name-grid div:nth-child(9) {
        justify-content: flex-end;
    }

    .name-grid div {
        display: flex;
    }

    .name-grid div:nth-child(-n+3) {
        align-items: flex-start;
    }

    .name-grid div:nth-child(n+4):nth-child(-n+6) {
        align-items: center;
    }

    .name-grid div:nth-child(n+7) {
        align-items: flex-end;
    }

    img{
        opacity: 50%;
    }
  </style>
</head>
<body>
    
    <img src="sudh.jpeg" alt="Background photo" class="background">

    <div class="name-grid">
        <div>Sudhanshu Gupta</div>
        <div>Sudhanshu Gupta</div>
        <div>Sudhanshu Gupta</div>

        <div>Sudhanshu Gupta</div>
        <div>Sudhanshu Gupta</div>
        <div>Sudhanshu Gupta</div>

        <div>Sudhanshu Gupta</div>
        <div>Sudhanshu Gupta</div>
        <div>Sudhanshu Gupta</div>
    </div>
</body>
</html>
